name: Собрать APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm ci

      - name: Скопировать планер в Android-проект
        run: npx cap sync android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/zhabiy-planer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zhabiy-planer-apk
          path: android/app/build/outputs/apk/debug/zhabiy-planer.apk
