name: Собрать APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm ci

      - name: Скопировать планер в Android-проект
        run: npx cap sync android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/zhabiy-planer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zhabiy-planer-apk
          path: android/app/build/outputs/apk/debug/zhabiy-planer.apk

      - name: Выложить APK в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android/app/build/outputs/apk/debug/zhabiy-planer.apk \
            --title "Жабий планер" \
            --notes "Свежая сборка. Скачай zhabiy-planer.apk на телефон и открой его, чтобы установить." --latest

      - name: Положить APK в ветку apk
        run: |
          mkdir /tmp/apk && cp android/app/build/outputs/apk/debug/zhabiy-planer.apk /tmp/apk/
          cd /tmp/apk && git init -q -b apk && git add . \
            && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "APK" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
